[package]
name = "chanlun-engine-rs"
version = "0.1.0"
edition = "2021"
description = "A-share stock-pool backtest engine built on barter-rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
barter = "0.14.0"
barter-instrument = "0.3.3"
barter-data = "0.13.0"
barter-execution = "0.9.0"
barter-integration = "0.12.0"
rust_decimal = "1.43.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
opt-level = 2
