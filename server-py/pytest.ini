[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --basetemp=.pytest-tmp
markers =
    unit: Part 1 — pure functions, no IO, no clock, no network
    integration: Part 2 — engine + registry + router wired together, still in-process
    e2e: Part 3 — real HTTP server subprocess over a socket
    live: hits real market data; enable with --live
