[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chanlun-server"
version = "1.0.0"
description = "ChanLun (缠论) analysis + A-share backtest engine, Python port of the Node backend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# 开源回测框架引擎 (engine="backtrader"); native 引擎不需要任何第三方依赖
backtrader = ["backtrader>=1.9.78"]
dev = ["pytest>=8.0", "backtrader>=1.9.78"]

[project.scripts]
chanlun-server = "chanlun_server.__main__:main"

[tool.setuptools]
packages = ["chanlun_server", "chanlun_server.strategies"]

[tool.setuptools.package-data]
"chanlun_server.strategies" = ["data/*.json"]
