<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#e94560" stroke-width="1.8" opacity="0.3"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#e94560" stroke-width="1.4" opacity="0.2"/>
  <circle cx="32" cy="32" r="4" fill="#e94560" opacity="0.15"/>
  <!-- Candlestick 1: green up -->
  <rect x="20" y="26" width="4" height="10" rx="0.5" fill="#4ecca3"/>
  <rect x="21.5" y="22" width="1" height="14" rx="0.5" fill="#4ecca3"/>
  <!-- Candlestick 2: red down -->
  <rect x="30" y="30" width="4" height="10" rx="0.5" fill="#e94560"/>
  <rect x="31.5" y="28" width="1" height="14" rx="0.5" fill="#e94560"/>
  <!-- Candlestick 3: green up (taller) -->
  <rect x="40" y="24" width="4" height="12" rx="0.5" fill="#4ecca3"/>
  <rect x="41.5" y="20" width="1" height="20" rx="0.5" fill="#4ecca3"/>
</svg>
